services:
  db:
    image: pgvector/pgvector:pg16
    container_name: retail_offers_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: retail_offers
    ports:
      - "5432:5432"
    volumes:
      # Automatically runs any .sql scripts in ./db on first initialization
      - ./db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retail_offers"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Scheduled worker: downloads flyers, runs Gemini extraction, crops
  # verification images, and loads everything into Postgres once a week.
  # Writes to the same DB and the same cropped_images/ volume the api reads
  # from -- no direct api<->ingestion coupling needed beyond that.
  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: retail_offers_ingestion
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/retail_offers
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - INGESTION_SCHEDULE_DAY=monday
      - INGESTION_SCHEDULE_TIME=05:00
      - RUN_ON_STARTUP=true
      # Per retailer, once its flyer URL is confirmed (see ingestion/downloaders/config.py):
      # - HOFER_FLYER_URL=...
    volumes:
      - ./downloads:/app/downloads
      - ./extracted_json:/app/extracted_json
      - ./cropped_images:/app/cropped_images
    depends_on:
      db:
        condition: service_healthy


  api:
    build:
      context: ./ocr_backend
      dockerfile: Dockerfile
    container_name: retail_offers_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/retail_offers
      - PYTHONUNBUFFERED=1
    volumes:
      - ./ocr_backend/app:/app/app
      - ./cropped_images:/app/cropped_images
      - ./downloads:/app/downloads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./ocr_frontend
      dockerfile: Dockerfile
    container_name: retail_offers_frontend
    command: npm run dev -- --host
    environment:
      - VITE_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true  # Enable file polling for Windows/WSL2
    volumes:
      - ./ocr_frontend:/app        # <--- Mount the entire ocr_frontend folder live
      - /app/node_modules          # Preserve container node_modules
    ports:
      - "3000:3000"

volumes:
  postgres_data: